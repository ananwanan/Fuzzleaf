name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform boilerplate
        run: flutter create --project-name fuzzleaf --org cc.ananwanan --platforms=android,ios,windows .
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze lib test
      - name: Unit tests
        run: flutter test
